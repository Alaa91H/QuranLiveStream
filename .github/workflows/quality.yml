name: QuranLiveStream Quality Gates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quran-live-quality-main
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check web/app.js
          node --check web/server.js
          node --check web/platform-layout.js
          node --check web/playback-hook.js
          node --check web/playback-sync.js
          for f in scripts/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Validate universal native stream architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'stream_multi.sh' systemd/quran-live.service
          grep -q 'quran_profile_dimensions' scripts/platforms.sh
          grep -q 'stream_worker.sh' scripts/stream_multi.sh
          grep -q 'stream_plan.sh' scripts/stream_multi.sh
          if grep -nE -- '-vf[[:space:]]+[^#]*(scale|crop|pad)|-filter_complex[[:space:]]+[^#]*(scale|crop|pad)' scripts/stream_worker.sh; then
            echo 'Native worker contains a forbidden scale/crop/pad FFmpeg filter.'
            exit 1
          fi
          grep -q 'platform.css' web/index.html
          grep -q 'platform-layout.js' web/index.html
          grep -q 'playback-sync.js' web/index.html
          grep -q 'playback-hook.js' scripts/broadcast_ui_group.sh
          grep -q 'master=$MASTER' scripts/broadcast_ui_group.sh
          grep -q 'layout="portrait"\|portrait)' scripts/platforms.sh
          grep -q 'quran-live.service' scripts/health_check.sh
          if grep -nE 'quran-live-(youtube|tiktok)\.service|stream_(youtube|tiktok)' scripts/health_check.sh; then
            echo 'health_check.sh still references the retired split-service architecture.'
            exit 1
          fi

          # Broadcast audio must share the master browser timeline. The old
          # independent concat playlist is allowed as a utility, never as an
          # FFmpeg live input because it can drift from the displayed ayah.
          grep -q 'quran_sink.monitor' scripts/stream_worker.sh
          if grep -q 'build_audio_playlist.sh' scripts/stream_worker.sh; then
            echo 'Live worker still contains the unsynchronized concat playlist path.'
            exit 1
          fi
          grep -q 'PREFLIGHT_AUDIO=$AUDIO' scripts/preflight.sh
          grep -q 'AUDIO="pulse"' scripts/preflight.sh

          # Recovery must prove process ownership, not merely trust stale PIDs.
          test -f scripts/process_guard.sh
          for f in scripts/stop_ui.sh scripts/broadcast_ui_group.sh scripts/watchdog.sh scripts/health_check.sh; do
            grep -q 'process_guard.sh' "$f"
          done
          grep -Fq '[[ " $cmd " == *" :$marker "* ]]' scripts/process_guard.sh
          grep -Fq '[[ " $cmd " == *" -progress $marker "* ]]' scripts/process_guard.sh
          grep -q 'quran_owned_pid "$cp" browser "$d"' scripts/watchdog.sh
          grep -q 'quran_owned_pid "$fp" ffmpeg "$d/ffmpeg.progress"' scripts/watchdog.sh
          grep -q 'quran_owned_pid "$cp" browser "$d"' scripts/health_check.sh
          grep -q 'quran_owned_pid "$fp" ffmpeg "$d/ffmpeg.progress"' scripts/health_check.sh
          grep -q 'quran_owned_pid "$xpid" xvfb "$DISPLAY_NUM"' scripts/broadcast_ui_group.sh
          grep -q 'quran_owned_pid "$cpid" browser "$GR"' scripts/broadcast_ui_group.sh
          if grep -q 'fuser -k' scripts/stop_ui.sh; then
            echo 'stop_ui.sh may kill an unrelated listener on the configured port.'
            exit 1
          fi

          # Each worker must explicitly own its FFmpeg child for clean restarts.
          grep -q 'FFMPEG_PID_FILE=.*ffmpeg.pid' scripts/stream_worker.sh
          grep -q "trap 'cleanup_worker; exit 0' INT TERM" scripts/stream_worker.sh

      - name: Validate platform ingest contracts
        shell: bash
        run: |
          set -euo pipefail
          source scripts/platforms.sh
          test "$(quran_target_max_profile kick)" = balanced
          test "$(quran_target_max_fps kick)" -le 60
          test "$(quran_target_max_bitrate_kbit kick)" -le 8000
          test "$(quran_target_codec kick)" = h264
          test "$(quran_target_h264_profile kick)" = main
          test "$(quran_target_audio_rate kick)" -le 48000
          test "$(quran_target_audio_channels kick)" = 2
          test "$(quran_target_max_audio_bitrate_kbit twitch)" -le 160
          grep -q 'quran_target_max_audio_bitrate_kbit' scripts/stream_worker.sh
          grep -q -- '-b:a "$GROUP_AUDIO_BITRATE"' scripts/stream_worker.sh
          CUSTOM1_H264_PROFILE=baseline
          export CUSTOM1_H264_PROFILE
          test "$(quran_target_h264_profile custom1)" = baseline
          grep -q 'h264_profile_rank' scripts/stream_worker.sh
          grep -q 'H264_PROFILE_RANK' scripts/stream_worker.sh
          if grep -nE 'X264_PARAMS=.*(keyint|min-keyint)=' scripts/hardware_profile.sh; then
            echo 'Fixed keyint in X264_PARAMS overrides the adaptive 2-second GOP.'
            exit 1
          fi
          grep -q 'GOP=$((FPS\*2))' scripts/stream_worker.sh
          grep -q -- '-g "$GOP" -keyint_min "$GOP"' scripts/stream_worker.sh

      - name: Validate playback state bus
        shell: bash
        run: |
          set -euo pipefail
          PORT=8898 QURAN_OFFLINE=1 node --require "$PWD/web/playback-hook.js" web/server.js >/tmp/quran-playback-test.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 1 http://127.0.0.1:8898/api/health >/dev/null 2>&1; then ready=1; break; fi
            sleep .1
          done
          test "$ready" = 1
          initial="$(curl -fsS http://127.0.0.1:8898/api/playback)"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.revision!==0) process.exit(1)' "$initial"
          code="$(curl -sS -o /tmp/playback.json -w '%{http_code}' -X POST -H 'X-Quran-Master: 1' 'http://127.0.0.1:8898/api/playback?surah=2&ayah=282')"
          test "$code" = 200
          node -e 'const p=JSON.parse(require("fs").readFileSync("/tmp/playback.json","utf8")); if(p.surah!==2||p.ayah!==282||p.revision!==1) process.exit(1)'
          mirrored="$(curl -fsS http://127.0.0.1:8898/api/playback)"
          node -e 'const p=JSON.parse(process.argv[1]); if(p.surah!==2||p.ayah!==282||p.revision!==1) process.exit(1)' "$mirrored"
          denied="$(curl -sS -o /dev/null -w '%{http_code}' -X POST 'http://127.0.0.1:8898/api/playback?surah=1&ayah=1')"
          test "$denied" = 403
          invalid="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'X-Quran-Master: 1' 'http://127.0.0.1:8898/api/playback?surah=114&ayah=7')"
          test "$invalid" = 400

      - name: Validate adaptive ceiling invariants
        shell: bash
        run: |
          set -euo pipefail
          export STREAM_PROFILE=nano
          source scripts/resource_governor.sh
          first="$(benchmark_ceiling)"
          test "$STREAM_PROFILE" = nano
          second="$(benchmark_ceiling)"
          test "$STREAM_PROFILE" = nano
          test "$first" = nano
          test "$second" = nano

      - name: Ensure .env secrets are not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '.env is tracked; refusing to expose streaming credentials.'
            exit 1
          fi
          test -f .env.example

      - name: Full offline QA suite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/qa.js
